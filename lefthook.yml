# git hooks。有効化: pnpm install (prepare が lefthook install を実行する)

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    # .astro は oxfmt が扱わない。ignorePatterns で全て外れたときに失敗させないため --no-error-on-unmatched-pattern を付ける
    format:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,mts,cts,json,jsonc,yml,yaml,toml,css,md,mdx}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # 文章の規則 (context/conventions.md)。経緯の混入とリンクは編集後のフックと CI が見る
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # 形式と AI の帰属表示の禁止は commitlint.config.mjs が持つ
    commitlint:
      run: pnpm exec commitlint --edit {1}
