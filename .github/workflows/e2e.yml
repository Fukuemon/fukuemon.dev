name: E2E

# 配信した状態のサイトとカタログをブラウザで操作する (context/testing/e2e.md)。
# 流すのは pull request だけで、Chromium だけを使う。develop への push では流さない。
on:
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node.js の版は mise.toml にある
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fukuemon/e2e exec playwright install --with-deps chromium

      # サイトの E2E は、ビルドした apps/web/dist/ を配信する。カタログの E2E は、config が Storybook をビルドして配信する
      - run: pnpm --filter @fukuemon/web run build

      - run: pnpm --filter @fukuemon/e2e test

      - if: success() || failure()
        run: pnpm --filter @fukuemon/ui e2e

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: |
            packages/e2e/test-results/
            packages/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
