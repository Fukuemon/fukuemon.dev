name: Deploy Preview

# 開発中のサイトを、プレビューの Worker (fukuemon-dev-preview) の workers.dev の URL へ配信する (ADR-0031)。
# 本番の Worker への deploy は deploy workflow が手動の起動だけで行い、この workflow は触らない。
# 本番を切り替えるときに、この workflow とプレビューの Worker を消す (#91)。noindex はこの経路でだけ足す。
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # check workflow は pull_request でも動く。既定ブランチへの push の成功だけを対象にする
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)
    steps:
      # workflow_run の既定は既定ブランチの HEAD のため、検査した commit を明示する
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node.js の版は mise.toml にある
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fukuemon/web run build

      - name: Cloudflare へ配信する
        run: pnpm --filter @fukuemon/web run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
