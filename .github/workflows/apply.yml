name: Terraform Apply

# 手動起動と infra environment の protection rules を必ず通す (ADR-0005)。
# plan と apply を別 job にして、plan の結果を見てから apply を承認できるようにする。
#
# infra/bootstrap/ は対象にしない。state をローカルに置く前提を壊すため、運用者が手元で 1 回だけ実行する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan で止めるか apply まで行うか
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # 版は infra/*/.terraform.lock.hcl と context/toolchain.md を正本にする
          terraform_version: 1.14.3
          terraform_wrapper: false

      # credential は必要な step にのみ渡す。job 単位に置くと action からも参照できる
      - name: init
        run: pnpm run infra:init -- -input=false -backend-config="bucket=${{ secrets.R2_STATE_BUCKET }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: plan
        run: pnpm run infra:plan -- -input=false -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_zone_name: ${{ vars.ZONE_NAME }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/cloudflare/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/cloudflare

      - name: init
        run: pnpm run infra:init -- -input=false -backend-config="bucket=${{ secrets.R2_STATE_BUCKET }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      # 変数は plan file が持つため TF_VAR を渡さない
      - name: apply
        run: pnpm run infra:apply -- -input=false tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
