name: Check

# 品質ゲート (ADR-0007)。pnpm の check を 1 本で通す。中身は package.json の check にある。
#
# build は apps/web の build の script が devDependency の vp で `vp run` を呼ぶ。setup-vp は使わず、
# タスクのキャッシュを run をまたいで持ち越さない (ADR-0017)。
#
# branches は "**" で受けて job 側で絞る (on ではブランチ名を動的に解決できない)。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# push と pull_request で別の group にする。同じにすると、PR のある枝への push で
# 片方が他方を打ち消し、PR の check が「実行されなかった」まま残る
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 依存と build script は第三者のコードを実行する。既定の書き込み権限を渡さない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # PR のある枝では push と pull_request が二重に走る。
    # PR か、既定ブランチへの push だけを対象にする
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      # react-doctor が基点のブランチとの差分を読む
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node.js の版は mise.toml にある。ここに数字を書くと二重管理になる
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # provider の版は infra/*/.terraform.lock.hcl にある。CLI の版はこの行で固定する (context/tech-stack.md)
          terraform_version: 1.14.3
          terraform_wrapper: false

      # terraform は pnpm の外にあるため check とは別に回す
      - run: pnpm run infra:check

      # knip は check に含む。無指摘の状態から始めるので、増えたら落とす
      - run: pnpm run check
