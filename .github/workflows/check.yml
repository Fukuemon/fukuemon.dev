name: Check

# 品質ゲート (ADR-0007)。lint → typecheck → contrast → test → build を 1 本で通す。
#
# `vp run` ではなく pnpm の script を直接叩く。toolchain.md の
# 「`vp` の無い環境でも `pnpm -r run build` が同じことをする」規約に合わせる。
#
# branches は "**" で受けて job 側で絞る (on ではブランチ名を動的に解決できない)。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# push と pull_request で別の group にする。同じにすると、PR のある枝への push で
# 片方が他方を打ち消し、PR の check が「実行されなかった」まま残る
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # PR のある枝では push と pull_request が二重に走り、chromium の取得も 2 回になる。
    # PR か、既定ブランチへの push だけを対象にする
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # 版は package.json の engines と packageManager を正本にする。
          # ここに数字を書くと二重管理になる
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 図をビルド時に SVG へ落とすため、build に chromium が要る (ADR-0009)。
      # 依存が入っていなければ何もしない
      - name: playwright の chromium を入れる
        run: |
          if pnpm --filter @fukuemon/web exec playwright --version >/dev/null 2>&1; then
            pnpm --filter @fukuemon/web exec playwright install --with-deps chromium
          else
            echo "playwright が無いので飛ばす"
          fi

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # 版は infra/*/.terraform.lock.hcl と context/toolchain.md を正本にする
          terraform_version: 1.14.3
          terraform_wrapper: false

      # terraform は pnpm の外にあるため check とは別に回す
      - run: pnpm run infra:check

      # knip は check に含む。無指摘の状態から始めるので、増えたら落とす
      - run: pnpm run check
