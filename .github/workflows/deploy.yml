name: Deploy

# check workflow が既定ブランチで成功したときだけ配信する (ADR-0005 / ADR-0007)。
# push を直接の契機にすると、check の結果を待たずに配信されてしまう。
on:
  workflow_run:
    workflows: [Check]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    steps:
      # workflow_run の既定は既定ブランチの HEAD のため、検査した commit を明示する
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build が図を SVG へ落とすため chromium が要る (ADR-0009)
      - name: playwright の chromium を入れる
        run: pnpm --filter @fukuemon/web exec playwright install --with-deps chromium

      - run: pnpm --filter @fukuemon/web run build

      - name: Cloudflare へ配信する
        run: pnpm --filter @fukuemon/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
