name: Deploy

# サイトを作り直す間は、develop へのマージで本番へ配信しない。運用者が手で起動したときだけ配信する。
# 作り直したサイトに切り替えるときに、check workflow の成功を契機にする workflow_run を戻す (ADR-0005 / ADR-0007)。
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node.js の版は mise.toml にある
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fukuemon/web run build

      - name: Cloudflare へ配信する
        run: pnpm --filter @fukuemon/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
