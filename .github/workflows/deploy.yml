name: Deploy

# 既定ブランチへの push で配信する (ADR-0005)。品質ゲートは check workflow が PR で回す (ADR-0007)。
# branches は "**" で受けて job 側で絞る (on ではブランチ名を動的に解決できない)。
on:
  push:
    branches: ["**"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build が図を SVG へ落とすため chromium が要る (ADR-0009)
      - name: playwright の chromium を入れる
        run: pnpm --filter @fukuemon/web exec playwright install --with-deps chromium

      - run: pnpm --filter @fukuemon/web run build

      - name: Cloudflare へ配信する
        run: pnpm --filter @fukuemon/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
